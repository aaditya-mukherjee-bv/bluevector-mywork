  <meta charset="UTF-8" />
  <title>Structured Data Markup
  </title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <div class="container" style="display: flex; flex-direction: row; gap: 32px; align-items: flex-start;">
    <div style="flex: 2 1 0; min-width: 0;">
      <div class="b_row">
        <div class="col-md-12">
          <p class="display-3 typography main-heading">Structured Data Markup</p>
          <div id="response" class="response-box">
            <div id="page-list" class="page-list-scroll">
              Loading response...
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="right-panel" style="flex: 1 1 350px; min-width: 320px; max-width: 420px; display: none;">
      <div class="right-panel-content"></div>
    </div>

  <script>
        // Function to check if a page contains structured data markup (JSON-LD)
        function hasStructuredDataMarkup(htmlString) {
          if (!htmlString) return false;
          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlString, 'text/html');
          // Look for <script type="application/ld+json">
          return !!doc.querySelector('script[type="application/ld+json"]');
        }
    async function fetchPreviewExpression() {
      try {
        const response = await fetch('/preview-expression', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            expression_field: "invalid_error",
            field_id: "14c3011b-762f-46e1-bed2-1122397b651f",
            fields: {}
          })
        });
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        const data = await response.json();
        console.log("Process Document Response:", data);
        let pages = [];
        if (typeof data.result === 'string') {
          try {
            pages = JSON.parse(data.result);
          } catch (e) {
            throw new Error('Failed to parse data.result as JSON');
          }
        } else if (Array.isArray(data.result)) {
          pages = data.result;
        } else {
          pages = [data.result];
        }
        const responseBox = document.getElementById('response');
        const pageList = document.getElementById('page-list');
        pageList.innerHTML = '';
        pages.forEach(page => {
          const page_row = document.createElement('div');
          page_row.className = 'page-row';
          if (hasStructuredDataMarkup(page.html || '')) {
            page_row.style.backgroundColor = '#d4edda'; // light green
          }
          page_row.innerHTML = `
            <div class="page-info page-name-info">${page.name}
              <!-- <div class="copy-icon" title="Copy Name" data-copy-value="${page.name}">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              </div> -->
            </div>
            <div class="page-info page-slug-info">${page.slug}
              <!-- <div class="copy-icon" title="Copy Slug" data-copy-value="${page.slug}">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              </div> -->
            </div>
          `;
          // Add copy functionality for all copy icons
          const copyIcons = page_row.querySelectorAll('.copy-icon');
          copyIcons.forEach(icon => {
            icon.addEventListener('click', function(e) {
              e.stopPropagation();
              const value = icon.getAttribute('data-copy-value');
              navigator.clipboard.writeText(value).then(() => {
                icon.style.color = '#28a745';
                setTimeout(() => { icon.style.color = '' }, 1000);
              });
            });
          });
          // Add click event to show right panel with markup form
          page_row.addEventListener('click', function() {
            // Highlight the selected row
            document.querySelectorAll('.page-row.selected').forEach(function(row) {
              row.classList.remove('selected');
            });
            page_row.classList.add('selected');

            const rightPanel = document.getElementById('right-panel');
            const rightContent = rightPanel.querySelector('.right-panel-content');
            rightPanel.style.display = 'flex';
            // Extract only structured data markup if present
            let structuredMarkup = '';
            if (page.html) {
              const parser = new DOMParser();
              const doc = parser.parseFromString(page.html, 'text/html');
              const ldJson = doc.querySelector('script[type="application/ld+json"]');
              if (ldJson) {
                structuredMarkup = ldJson.innerText || ldJson.textContent || '';
              }
            }
            rightContent.innerHTML = `
              <div class="right-panel-header sticky-header">
                <span class="right-panel-title">Config Settings</span>
                <button class="close-right-panel" title="Close">&times;</button>
              </div>
              <div class="right-panel-divider"></div>
              <form class="markup-form improved-form">
                <div class="right-col" style="max-width:100%;">
                  <div class="page-id-label">Page ID</div>
                  <input type="text" id="page-id" name="page_id" value="${page.id || ''}" placeholder="Enter Page ID here..." readonly class="improved-input" />
                </div>
                <div class="left-col" style="margin-top:18px;">
                  <a style="text-decoration: none; margin-bottom:8px; font-weight:500; color:#1976d2;" class="link" href="https://technicalseo.com/tools/schema-markup-generator/" target="_blank" rel="noopener noreferrer">Structured Data Markup Generator</a>
                  <div class="markup-label">Structured Data Markup</div>
                  <textarea class="struct-dat-input improved-textarea" id="structured-data-markup" name="structured_data_markup" placeholder="Enter structured data markup here..." rows="10">${structuredMarkup ? structuredMarkup.replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''}</textarea>
                  ${structuredMarkup ? '' : '<div class="no-markup">No structured data markup found for this page.</div>'}
                  <div class="add-markup-label">Add your structured data markup above.</div>
                </div>
                <div style="width:100%;text-align:right;margin-top:18px;">
                  <input type="submit" value="Submit" class="submit-btn" />
                </div>
              </form>
            `;
            // Add close button functionality
            rightPanel.querySelector('.close-right-panel').onclick = function() {
              rightPanel.style.display = 'none';
            };
          });
          pageList.appendChild(page_row);
        });
      } catch (error) {
        console.error('Error processing documents:', error);
        document.getElementById('response').innerHTML = `<span class="error">Error: ${error.message}</span>`;
      }
    }
    // Call function on page load
    fetchPreviewExpression();
    const style = document.createElement('style');
    style.innerHTML = `
    .page-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 18px;

      transition: box-shadow 0.2s, background 0.2s;
      cursor: pointer;
      position: relative;
      min-height: 38px;
      width: 100%;
      box-sizing: border-box;
    }
    .page-row.selected {
      background: linear-gradient(90deg, #e3f0ff 0%, #f7fbff 100%);
      box-shadow: 0 6px 24px rgba(25, 118, 210, 0.13), 0 2px 8px rgba(25, 118, 210, 0.08);
      border: 2px solid #1976d2;
      color: #174ea6;
      z-index: 2;
      position: relative;
      transition: box-shadow 0.2s, background 0.2s, border 0.2s;
    }
    .page-row:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      background: #eaf3fb;
    }
    .page-list-scroll {
      max-height: 500px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .page-info {
      flex: 1 1 0;
      flex-wrap: wrap;

    }
    <!-- .copy-icon {

    } -->
    .page-name-info:hover .copy-icon,
    .page-slug-info:hover .copy-icon {
      display: inline-flex;
      color: #1976d2;
      background: none;
      border: none;
      box-shadow: none;
    }
    <!-- .copy-icon:active {
      color: #388e3c;

    } -->
    #right-panel {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(44,62,80,0.13), 0 1.5px 6px rgba(44,62,80,0.07);
      border: 1.5px solid #e3e7ed;

      min-height: 400px;
      transition: box-shadow 0.2s, border 0.2s;
      position: relative;
      overflow-y: auto;
      max-height: 80vh;
      display: none;
      flex-direction: column;
    }
    .right-panel-content {
      padding: 32px 32px 24px 32px;
      overflow-y: auto;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(44,62,80,0.07);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }
    .right-panel-divider {
      height: 1.5px;
      background: linear-gradient(90deg, #e3e7ed 0%, #fff 100%);
      margin-bottom: 18px;
      margin-top: -1px;
      border-radius: 2px;
    }
    .improved-form .right-col, .improved-form .left-col {
      margin-bottom: 12px;
    }
    .improved-input {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1.5px solid #b0b8c1;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(44,62,80,0.07);
      background: #f7fafd;
      margin-bottom: 8px;
      font-family: inherit;
    }
    .improved-textarea {
      width: 100%;
      min-width: 220px;
      max-width: 100%;
      font-family: monospace;
      font-size: 15px;
      padding: 14px;
      border: 1.5px solid #b0b8c1;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(44,62,80,0.07);
      background: #f7fafd;
      resize: vertical;
      margin-bottom: 8px;
    }
    .right-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 18px 0;
      border-bottom: 1.5px solid #e3e7ed;

    }
    .right-panel-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1a2233;
      letter-spacing: 0.01em;
    }
    .close-right-panel {
      background: none;
      border: none;
      font-size: 2.1rem;
      color: #b0b8c1;

    }
    .close-right-panel:hover {
      background: #f6f8fa;
      color: #d32f2f;
      box-shadow: 0 2px 8px rgba(211,47,47,0.08);
    }
    .markup-label {
      font-size: 1.12rem;
      font-weight: 600;

    }
    .add-markup-label {
      margin-top: 10px;
      font-size: 1.01rem;
      color: #6c7a89;
      font-style: italic;
    }
    .no-markup {
      margin-top: 10px;

      font-weight: 600;
      background: #fff6f6;

      display: inline-block;
    }
    .page-id-label {
      font-size: 1.12rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #1a2233;
    }
    `;
    document.head.appendChild(style);
  </script>
