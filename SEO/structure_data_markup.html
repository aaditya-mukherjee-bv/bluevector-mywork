<body id="i87m">
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Structured Data Manager
  </title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap"
    rel="stylesheet" />
  <div id="app-container">
    <main class="content-wrapper">
      <section id="left-section">
        <div class="section-header">
          <h2>Page Inventory
          </h2>
          <p>Select a page to audit or edit schema markup
          </p>
        </div>
        <div id="response" class="response-box">
          <div id="page-list" class="page-list-container">
            <div class="loading-state">
              <div class="spinner">
              </div>
              <p>Analyzing document structure...
              </p>
            </div>
          </div>
        </div>
      </section>
      <aside id="right-panel">
        <div class="panel-placeholder">
          <svg fill="none" height="48" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
            stroke-width="1" viewBox="0 0 24 24" width="48" xmlns="http://www.w3.org/2000/svg" class="placeholder-icon">
            <rect height="18" rx="2" width="18" x="3" y="3">
            </rect>
            <path d="M7 8h10">
            </path>
            <path d="M7 12h10">
            </path>
            <path d="M7 16h10">
            </path>
          </svg>
          <p>Select a page to configure settings
          </p>
        </div>
        <div id="right-panel-content" class="right-panel-content">
        </div>
      </aside>
    </main>
  </div>
  <script>
    /**
     * CONFIGURATION & STYLE INJECTION
     */
    const styles = `
:root { 
--navy-900: #0f172a; 
--navy-800: #1e293b; 
--navy-700: #334155; 
--accent: #3b82f6; 
--accent-hover: #2563eb; 
--success: #10b981; 
--error: #ef4444; 
--bg-main: #f8fafc; 
--border: #e2e8f0; 
--text-main: #1e293b; 
--text-muted: #64748b; 
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg-main); color: var(--text-main); line-height: 1.5; }
#app-container { display: flex; flex-direction: column; min-height: 100vh; }
/* --- LAYOUT FIX: align-items: flex-start prevents right panel form stretching --- */
.content-wrapper { 
display: flex; 
flex: 1; 
max-width: 1400px; 
margin: 2rem auto; 
gap: 2rem; 
width: 100%; 
padding: 0 2rem; 
align-items: flex-start; /* CRITICAL FIX */
}
/* LEFT SECTION */
#left-section { flex: 2; min-width: 0; }
.section-header { margin-bottom: 1.5rem; }
.section-header h2 { margin: 0; font-size: 1.5rem; color: var(--navy-900); }
.section-header p { margin: 4px 0 0; color: var(--text-muted); }
.page-list-container { display: grid; gap: 12px; }
.page-row { background: white; padding: 1.25rem; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
.page-row:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
.page-row.selected { border-color: var(--accent); background: #eff6ff; box-shadow: 0 0 0 2px var(--accent); }
.page-meta { display: flex; flex-direction: column; gap: 4px; }
.page-name { font-weight: 600; color: var(--navy-900); }
.page-slug { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text-muted); }
.page-row-actions { display: flex; align-items: center; gap: 12px; }
.visit-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-muted); text-decoration: none; padding: 8px 14px; background: white; border: 1px solid var(--border); border-radius: 100px; font-weight: 600; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.visit-btn svg { width: 12px; height: 12px; stroke-width: 2.5px; transition: transform 0.2s ease; }
.visit-btn:hover { background: white; border-color: var(--accent); color: var(--accent); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15); transform: translateY(-1px); }
.visit-btn:hover svg { transform: translate(1px, -1px); }
.badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
.badge-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
.badge-none { background: #f1f5f9; color: #475569; border: 1px solid var(--border); }
/* --- RIGHT PANEL --- */
#right-panel { 
flex: 1.2; 
background: white; 
border-radius: 16px; 
border: 1px solid rgba(226, 232, 240, 0.8);
box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08); 
min-height: 400px; 
position: sticky; 
top: 2rem; 
/* Ensure it doesn't touch the very bottom of viewport */
max-height: calc(100vh - 4rem); 
overflow: hidden; 
display: flex; 
flex-direction: column; 
}
/* Placeholder State */
.panel-placeholder { 
display: flex; 
flex-direction: column; 
align-items: center; 
justify-content: center; 
height: 100%; 
color: var(--text-muted); 
text-align: center; 
padding: 2rem; 
background: radial-gradient(circle at center, #f8fafc 0%, #ffffff 70%);
}
.placeholder-icon { margin-bottom: 1rem; opacity: 0.2; color: var(--navy-700); }
/* Panel Content Layout */
.right-panel-content { display: none; padding: 0; height: 100%; flex-direction: column; }
/* Header */
.panel-header { 
padding: 1.25rem 2rem;
border-bottom: 1px solid var(--border); 
display: flex; 
justify-content: space-between; 
align-items: center; /* Vertically align title and close button */
background: linear-gradient(to bottom, #ffffff, #fcfcfc);
}
.panel-header h3 { color: var(--navy-900); font-weight: 700; letter-spacing: -0.02em; }
/* --- MODERN CLOSE BUTTON --- */
#close-panel {
width: 36px; 
height: 36px;
display: flex; 
align-items: center; 
justify-content: center;
border-radius: 10px;
background: white;
border: 1px solid var(--border);
color: var(--text-muted);
transition: all 0.2s ease;
cursor: pointer;
padding: 0;
}
#close-panel svg {
width: 18px;
height: 18px;
stroke-width: 2.5;
}
#close-panel:hover {
background-color: #f1f5f9;
color: var(--navy-900);
border-color: #cbd5e1;
transform: scale(1.05);
}
/* Body */
.panel-body { 
padding: 1.5rem 2rem;
flex: 1; 
overflow-y: auto; 
background-color: #ffffff;
}
/* Utility Link (Schema Gen) */
.link-tool { 
display: inline-flex; 
align-items: center; 
gap: 8px; 
color: var(--text-muted); 
text-decoration: none; 
font-size: 0.8rem; 
font-weight: 600; 
margin-bottom: 1rem; 
padding: 6px 10px;
border: 1px solid var(--border);
border-radius: 8px;
transition: all 0.2s ease;
background: #fff;
}
.link-tool:hover { 
border-color: var(--accent); 
color: var(--accent); 
transform: translateY(-1px);
box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}
/* Textarea */
.label-group label { display: block; font-weight: 600; margin-bottom: 0.75rem; font-size: 0.9rem; color: var(--navy-800); }
.schema-textarea { 
width: 100%; 
background: #1e293b; 
color: #f1f5f9; 
font-family: 'JetBrains Mono', monospace; 
font-size: 0.85rem; 
line-height: 1.6;
padding: 1rem; 
border-radius: 10px; 
border: 1px solid #334155; 
resize: vertical; 
min-height: 200px; 
box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
transition: border 0.2s, box-shadow 0.2s;
}
.schema-textarea:focus { 
outline: none; 
border-color: var(--accent); 
box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 0 0 3px rgba(59, 130, 246, 0.15);
}
.schema-textarea::placeholder { color: #64748b; font-style: italic; }
/* Footer */
.panel-footer { 
padding: 1rem 2rem; 
border-top: 1px solid var(--border); 
background: #f8fafc; 
display: flex;
justify-content: flex-end;
}
.btn-submit { 
width: 100%; 
background: var(--accent); 
color: white; 
border: none; 
padding: 0.75rem; 
border-radius: 10px; 
font-weight: 600; 
font-size: 0.95rem;
cursor: pointer; 
transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
}
.btn-submit:hover { 
background: var(--accent-hover); 
transform: translateY(-1px);
box-shadow: 0 6px 12px -2px rgba(59, 130, 246, 0.4);
}
.btn-submit:active { transform: translateY(0); }
.btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
/* Helpers */
.no-markup-alert { background: #fff7ed; color: #9a3412; padding: 12px; border-radius: 8px; font-size: 0.85rem; border: 1px solid #ffedd5; margin-top: 1rem; display: flex; align-items: center; gap: 8px; }
.loading-state { text-align: center; padding: 4rem; color: var(--text-muted); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }
`;
    const styleSheet = document.createElement("style");
    styleSheet.innerText = styles;
    document.head.appendChild(styleSheet);
    /**
     * MAIN LOGIC
     */
    function hasStructuredDataMarkup(htmlString) {
      if (!htmlString) return false;
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlString, 'text/html');
      return !!doc.querySelector('script[type="application/ld+json"]');
    }
    async function fetchPreviewExpression() {
      const pageList = document.getElementById('page-list');
      try {
        console.log("Fetching pages...");
        const response = await fetch('/preview-expression', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
          ,
          body: JSON.stringify({
            expression_field: "invalid_error",
            field_id: "14c3011b-762f-46e1-bed2-1122397b651f",
            fields: {
            }
          }
          )
        }
        );
        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}
`);
        }
        const data = await response.json();
        console.log("Raw API Response:", data);
        let pages = [];
        let result = data.result;
        if (!result && Array.isArray(data)) result = data;
        if (typeof result === 'string') {
          try {
            pages = JSON.parse(result);
          }
          catch (e) {
            console.error("JSON Parse Error on result string:", e);
            throw new Error("Result was a string but not valid JSON.");
          }
        }
        else if (Array.isArray(result)) {
          pages = result;
        }
        else if (result && typeof result === 'object') {
          pages = [result];
        }
        else {
          if (Array.isArray(data)) pages = data;
        }
        if (!pages || pages.length === 0) {
          pageList.innerHTML = `<div class="no-markup-alert">No pages found (or empty response).</div>`;
          return;
        }
        renderPageList(pages);
      }
      catch (error) {
        console.error('Fetch Error:', error);
        pageList.innerHTML = `<div class="no-markup-alert"><strong>Error:</strong> ${error.message}
    </div>`;
      }
    }
    function renderPageList(pages) {
      const pageList = document.getElementById('page-list');
      pageList.innerHTML = '';
      pages.forEach(page => {
        const pName = page.name || 'Untitled Page';
        const pSlug = page.slug || '#';
        const pId = page.id;
        const pHtml = page.html || '';
        const hasMarkup = hasStructuredDataMarkup(pHtml);
        const pageRow = document.createElement('div');
        pageRow.className = 'page-row';
        pageRow.innerHTML = `
<div class="page-meta">
<span class="page-name">${pName}
    </span>
<span class="page-slug">/${pSlug}
    </span>
    </div>
<div class="page-row-actions">
<a href="https://snapapp.com/page/${pSlug}
" target="_blank" class="visit-btn" onclick="event.stopPropagation()">
<span>Go to page</span>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
<polyline points="15 3 21 3 21 9"></polyline>
<line x1="10" y1="14" x2="21" y2="3"></line>
    </svg>
    </a>
<span class="badge ${hasMarkup ? 'badge-success' : 'badge-none'}
">
${hasMarkup ? '✓ Schema Found' : 'No Schema'}
    </span>
    </div>
`;
        pageRow.addEventListener('click', () => {
          document.querySelectorAll('.page-row').forEach(r => r.classList.remove('selected'));
          pageRow.classList.add('selected');
          showPanel({
            id: pId, name: pName, html: pHtml
          }
          );
        }
        );
        pageList.appendChild(pageRow);
      }
      );
    }
    function showPanel(page) {
      const rightPanel = document.getElementById('right-panel');
      const placeholder = rightPanel.querySelector('.panel-placeholder');
      const content = document.getElementById('right-panel-content');
      placeholder.style.display = 'none';
      content.style.display = 'flex';
      let structuredMarkup = '';
      if (page.html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(page.html, 'text/html');
        const ldJson = doc.querySelector('script[type="application/ld+json"]');
        if (ldJson) {
          structuredMarkup = ldJson.outerHTML || '';
        }
      }
      content.innerHTML = `
<div class="panel-header">
<div>
<h3 style="margin:0; font-size:1.1rem;">${page.name}
    </h3>
<p style="margin:0; font-size:0.85rem; color:var(--text-muted)">Configuration Settings</p>
    </div>
<button id="close-panel" title="Close Panel">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    </div>
<div class="panel-body">
<a class="link-tool" href="https://technicalseo.com/tools/schema-markup-generator/" target="_blank">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
Schema Generator
    </a>
<div class="label-group">
<label>JSON-LD Structured Data</label>
<textarea class="schema-textarea" id="markup-input" spellcheck="false" placeholder="Paste your <script type='application/ld+json'> content here...">${structuredMarkup}
    </textarea>
${!structuredMarkup ? '<div class="no-markup-alert"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> Notice: No existing markup detected on this page.</div>' : ''}
    </div>
    </div>
<div class="panel-footer">
<button class="btn-submit" id="save-changes-btn">Save Changes</button>
    </div>
`;
      document.getElementById('close-panel').onclick = () => {
        content.style.display = 'none';
        placeholder.style.display = 'flex';
        document.querySelectorAll('.page-row').forEach(r => r.classList.remove('selected'));
      };
      document.getElementById("save-changes-btn").onclick = function (e) {
        e.preventDefault();
        const btn = this;
        const rawMarkup = document.getElementById("markup-input").value;
        if (rawMarkup.trim() && !rawMarkup.includes('application/ld+json')) {
          alert("Warning: The input must include the <script type='application/ld+json'> tags.");
          return;
        }
        btn.innerText = "Saving...";
        btn.disabled = true;
        console.log('Saving Page ID:', page.id);
        fetch('/preview-expression', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
          ,
          body: JSON.stringify({
            expression_field: "invalid_error",
            field_id: "5be75e6e-1e3e-47d5-8775-b6351386642f",
            fields: {
              page_id: page.id,
              // json_ld_input: JSON.stringify(rawMarkup)
              json_ld_input: rawMarkup
            }
          }
          )
        }
        )
          .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}
`);
            return response.json();
          }
          )
          .then(data => {
            console.log('Save Success:', data);
            alert('Changes saved successfully!');
            fetchPreviewExpression();
          }
          )
          .catch(error => {
            console.error('Save Error:', error);
            alert('Failed to save changes: ' + error.message);
          }
          )
          .finally(() => {
            btn.innerText = "Save Changes";
            btn.disabled = false;
          }
          );
      };
    }
    // INITIALIZATION
    fetchPreviewExpression();
  </script>
</body>
